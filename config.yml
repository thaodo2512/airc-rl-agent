ENV_CONFIG:
  jetbot:
    robot_name: 'jetbot-v0'
    wrapped_env: 'learning_racer.agent.teleoperation:TeleoperationEnv'
    parts:
      teleoperator: 'learning_racer.teleoperate:Teleoperator'
  jetracer:
    robot_name: 'jetracer-v0'
    wrapped_env: 'learning_racer.agent.teleoperation:TeleoperationEnv'
    parts:
      teleoperator: 'learning_racer.teleoperate:Teleoperator'
  jetbot-auto:
    robot_name: 'jetbot-v0'
    wrapped_env: 'learning_racer.agent.auto_stop:AutoStopEnv'
    parts:
      teleoperator: 'learning_racer.teleoperate:Teleoperator'
  jetracer-auto:
    robot_name: 'jetracer-v0'
    wrapped_env: 'learning_racer.agent.auto_stop:AutoStopEnv'
    parts:
      teleoperator: 'learning_racer.teleoperate:Teleoperator'
  sim:
    robot_name: 'donkey-generated-track-v0'
    conf:
      exe_path: 'remote'
      port: 9091
      host: 'localhost'
    wrapped_env: 'learning_racer.agent.simulator:SimulatorEnv'

SAC_SETTING:
  LOG_INTERVAL: 1
  VERBOSE: 2
  LEARNING_RATE: 3e-4
  ENT_COEF: 'auto_0.1'
  TRAIN_FREQ: 1
  BATCH_SIZE: 128
  GRADIENT_STEPS: 400
  LEARNING_STARTS: 1000
  BUFFER_SIZE: 30000
  VARIANTS_SIZE: 32  # Updated to match the improved VAE's z_dim=128
  IMAGE_CHANNELS: 3
  GAMMA: 0.99
  TAU: 0.02
  USER_SDE_AT_WARMUP: true
  USER_SDE: false
  SDE_SAMPLE_FREQ: 64

REWARD_SETTING:
  REWARD_CRASH: -10
  CRASH_REWARD_WEIGHT: 5
  THROTTLE_REWARD_WEIGHT: 0.3
  STEERING_PENALTY_WEIGHT: 0.05  # Penalty coefficient for high steering values, e.g., -0.05 * |steering|
  LACK_PROGRESS_PENALTY: 0.02    # Fixed penalty if latent vector change is below threshold (indicating lack of progress)
  PROGRESS_THRESHOLD: 0.1        # Threshold for Euclidean distance between consecutive latent vectors to detect progress

AGENT_SETTING:
  N_COMMAND_HISTORY: 20
  MIN_STEERING: -0.2
  MAX_STEERING: 0.2
  MIN_THROTTLE: 0.2  # Lower from 0.7
  MAX_THROTTLE: 0.3  # Lower from 0.95
  MAX_STEERING_DIFF: 0.05

JETRACER_SETTING:
  STEERING_CHANNEL: 0
  THROTTLE_CHANNEL: 1
  STEERING_GAIN: -0.65
  THROTTLE_GAIN: -0.8

VAE_AUTO_STOP:
  VAE_AUTO_STOP: true  # Enabled to use VAE for auto-stop functionality with the generated model
  VAE_AUTO_STOP_THRESHOLD: 700  # May need tuning based on MSE loss scale; test with your dataset
